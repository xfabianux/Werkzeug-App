function esc(value){
return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

function createGroupCode(){

  }
  return result;
}

function previewPhoto(event){
const file=event.target.files[0];
if(!file)return;

const reader=new FileReader();

reader.onload=()=>{
document.getElementById("photoPreview").innerHTML=
`<img class="photo-preview" src="${reader.result}" alt="Vorschau">`;
};

reader.readAsDataURL(file);
}

function resizeImage(file){
return new Promise((resolve,reject)=>{
const reader=new FileReader();

reader.onload=()=>{
const img=new Image();

img.onload=()=>{
const maxSize=1000;
let width=img.width;
let height=img.height;

if(width>height){
if(width>maxSize){
height=Math.round(height*maxSize/width);
width=maxSize;
}
}else{
if(height>maxSize){
width=Math.round(width*maxSize/height);
height=maxSize;
}
}

const canvas=document.createElement("canvas");
canvas.width=width;
canvas.height=height;

canvas
.getContext("2d")
.drawImage(img,0,0,width,height);

resolve(canvas.toDataURL("image/jpeg",0.75));
};

img.onerror=reject;
img.src=reader.result;
};

reader.onerror=reject;
reader.readAsDataURL(file);
}

function toDateValue(date){
  return `${date.getFullYear()}-${
    String(date.getMonth()+1).padStart(2,"0")
  }-${
    String(date.getDate()).padStart(2,"0")
  }`;
}

function parseGermanDate(raw){
  const m=raw.trim().match(
    /^(\d{1,2})\.(\d{1,2})\.(\d{4})$/
  );

  if(!m)return null;

  const d=Number(m[1]);
  const mo=Number(m[2]);
  const y=Number(m[3]);

  const x=new Date(y,mo-1,d);

  if(
    x.getFullYear()!==y ||
    x.getMonth()!==mo-1 ||
    x.getDate()!==d
  ){
    return null;
  }

  return toDateValue(x);
}

async function returnTool(id){
  const {data,error}=await db
    .from("tools")
    .select("*")
    .eq("id",id)
    .eq("group_code",S.group)
    .single();

  if(error){
    showMessage(
      "Werkzeug konnte nicht gefunden werden.",
      "error"
    );
    return;
  }

  const {error:updateError}=await db
    .from("tools")
    .update({
      borrower:null,
      borrowed_at:null,
      due_date:null
    })
    .eq("id",id)
    .eq("group_code",S.group);

  if(updateError){
    showMessage(
      "Rückgabe fehlgeschlagen.",
      "error"
    );
    return;
  }

  await db
    .from("loan_history")
    .update({
      returned_at:new Date().toISOString()
    })
    .eq("tool_id",id)
    .eq("group_code",S.group)
    .is("returned_at",null);

  showMessage(
    "Werkzeug zurückgegeben ✓",
    "success"
  );

  home();
}

async function people(){
  content.innerHTML=navigation()+`
  <div class="box">
    <b>Dein Gruppen-Code</b>

    <div class="group-code">
      ${esc(S.group)}
    </div>

    <p class="muted">
      Teile diesen Code mit deinen Freunden.
      Sie können damit deiner Gruppe beitreten.
    </p>

    <button onclick="copyGroupCode()">
      📋 Code kopieren
    </button>

    <button onclick="addPerson()">
      ＋ Person hinzufügen
    </button>
  </div>

  <div class="box">
    <h3>Mitglieder</h3>
    <div id="membersList">Laden...</div>
  </div>`;

  const {data,error}=await db
    .from("members")
    .select("*")
    .eq("group_code",S.group)
    .order("name");

  if(error){
    document.getElementById("membersList").innerHTML=
      `<p class="muted">${esc(error.message)}</p>`;
    return;
  }

  const members=data||[];

  document.getElementById("membersList").innerHTML=
    members.length
    ?members.map(member=>
      `<div class="member">
        👤 <b>${esc(member.name)}</b>
      </div>`
    ).join("")
    :`<p class="muted">Noch keine Mitglieder.</p>`;
}

async function copyGroupCode(){
  try{
    await navigator.clipboard.writeText(S.group);

    showMessage(
      "Gruppencode kopiert ✓",
      "success"
    );

  }catch(e){

    showMessage(
      "Code: "+S.group,
      "notice"
    );
  }
}

async function addPerson(){
  const name=prompt("Name der Person");

  if(!name||!name.trim())return;

  const cleanName=name.trim();

  const {data}=await db
    .from("members")
    .select("id")
    .eq("group_code",S.group)
    .eq("name",cleanName)
    .limit(1);

  if(data&&data.length){
    showMessage(
      "Diese Person ist bereits in der Gruppe.",
      "error"
    );
    return;
  }

  const {error}=await db
    .from("members")
    .insert({
      group_code:S.group,
      name:cleanName
    });

  if(error){
    showMessage(
      "Person konnte nicht hinzugefügt werden.",
      "error"
    );
    return;
  }

  showMessage(
    "Person hinzugefügt ✓",
    "success"
  );

  people();
}

function changeGroup(){
  const ok=confirm(
    "Möchtest du die gespeicherte Gruppe verlassen?"
  );

  if(!ok)return;

  clearUser();
  welcome();
}

start();
</script>
