<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>TOOLVENTAR</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#eef0f2;
  color:#111827;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

header{
  background:#101820;
  color:white;
  padding:10px 16px;
  padding-top:calc(10px + env(safe-area-inset-top));
  box-shadow:0 3px 14px rgba(0,0,0,.18);
}

.brand{
  max-width:700px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:12px;
}

.brand-logo{
  width:58px;
  height:58px;
  border-radius:14px;
  object-fit:cover;
  flex-shrink:0;
  background:#111;
}

.brand-title{
  font-size:23px;
  font-weight:900;
  letter-spacing:.8px;
  line-height:1;
}

.brand-title span{
  color:#f59e0b;
}

.brand-subtitle{
  margin-top:6px;
  color:#cbd5e1;
  font-size:12px;
  font-weight:500;
}

main{
  max-width:700px;
  margin:auto;
  padding:16px;
  padding-bottom:40px;
}

.box{
  background:white;
  border-radius:16px;
  padding:16px;
  margin-bottom:12px;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
}

h1,h2,h3{
  margin-top:0;
}

input,textarea,select{
  width:100%;
  padding:13px;
  border:1px solid #d1d5db;
  border-radius:10px;
  font-size:16px;
  margin:6px 0 12px;
  background:white;
}

input[type="date"]{
  min-height:48px;
}

textarea{
  min-height:90px;
  resize:vertical;
}

button{
  border:0;
  border-radius:11px;
  padding:12px 15px;
  background:#101820;
  color:white;
  font-size:16px;
  font-weight:600;
  margin:4px 4px 4px 0;
}

button.secondary{
  background:#e5e7eb;
  color:#111827;
}

button.danger{
  background:#b91c1c;
}

button:disabled{
  opacity:.55;
}

label{
  display:block;
  font-size:14px;
  font-weight:600;
  margin-top:5px;
}

.muted{
  color:#6b7280;
}

.row{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  align-items:center;
}

.nav{
  margin-bottom:12px;
}

.nav button{
  font-size:14px;
}

.tool{
  display:flex;
  gap:13px;
  align-items:flex-start;
}

.tool-photo,
.tool-photo-placeholder{
  width:90px;
  height:90px;
  border-radius:13px;
  flex-shrink:0;
}

.tool-photo{
  object-fit:cover;
  background:#e5e7eb;
}

.tool-photo-placeholder{
  background:#e5e7eb;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
}

.tool-info{
  flex:1;
  min-width:0;
}

.tool-name{
  font-size:18px;
  font-weight:700;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:999px;
  font-size:12px;

}

.badge.loan{
  background:#fee2e2;
  color:#991b1b;
}

.group-code{
  font-size:30px;
  font-weight:800;
  letter-spacing:3px;
}

.notice{
  padding:11px 13px;
  background:#eef2ff;
  border-radius:10px;
  margin-bottom:12px;
}

.error{
  background:#fee2e2;
  color:#991b1b;
}

.success{
  background:#dcfce7;
  color:#166534;
}

.hidden{
  display:none!important;
}

.member{
  padding:10px 0;
  border-bottom:1px solid #eee;
}

.member:last-child{
  border-bottom:0;
}

.small{
  font-size:13px;
}

.photo-preview{
  width:140px;
  height:140px;
  object-fit:cover;
  border-radius:14px;
  margin:5px 0 10px;
}

.empty{
  text-align:center;
  padding:25px 10px;
  color:#6b7280;
}

.search-wrap{
  position:relative;
}

.search-wrap input{
  padding-right:45px;
}

.search-icon{
  position:absolute;
  right:14px;
  top:17px;
  font-size:20px;
  color:#6b7280;
  pointer-events:none;
}

.tool-actions{

}

.owner-note{
  margin-top:8px;

  background:#f8fafc;
  color:#6b7280;
  font-size:12px;
}

.hero{
  background:linear-gradient(145deg,#111827,#202b35);
  color:white;
  border-radius:20px;
  padding:22px 18px;
  margin-bottom:12px;
  box-shadow:0 5px 20px rgba(0,0,0,.14);
  overflow:hidden;
  position:relative;
}

.hero:after{
  content:"";
  position:absolute;
  width:150px;
  height:150px;
  border-radius:50%;
  background:#f59e0b;

  right:-50px;
  top:-50px;
}

.hero-top{
  position:relative;

}

.hero-title{
  font-size:29px;
  font-weight:900;
  letter-spacing:.5px;

}

.hero-title span{

}

.hero-text{

  font-size:14px;

}

.share-visual{
  position:relative;
  height:125px;
  margin-top:4px;
}

.person{
  position:absolute;
  bottom:18px;
  width:62px;
  text-align:center;
  font-size:45px;
  line-height:1;
}

.person.left{
  left:12%;
}

.person.right{
  right:12%;
}

.toolbox{
  position:absolute;
  left:50%;
  bottom:5px;
  transform:translateX(-50%);
  width:125px;
  height:48px;
  background:#111827;
  border:3px solid #f59e0b;
  border-radius:8px 8px 12px 12px;
  box-shadow:0 5px 12px rgba(0,0,0,.35);
}

.toolbox:before{
  content:"";
  position:absolute;
  left:31px;
  top:-21px;
  width:57px;
  height:20px;
  border:4px solid #f59e0b;
  border-bottom:0;
  border-radius:12px 12px 0 0;
}

.toolbox:after{
  content:"🔧";
  position:absolute;
  left:42px;
  top:5px;
  font-size:27px;
}

.hand-tool{
  position:absolute;
  left:50%;
  top:28px;
  transform:translateX(-50%);
  font-size:31px;
  z-index:2;
}

.hero-slogan{
  text-align:center;
  font-size:13px;
  font-weight:700;
  color:#fbbf24;
  letter-spacing:.4px;
  margin-top:3px;
}

.loan-date-box{
  background:#f8fafc;
  border:1px solid #e5e7eb;
  border-radius:13px;
  padding:12px;
  margin:12px 0;
}

.loan-date-row{
  display:flex;
  gap:10px;
}

.loan-date-column{
  flex:1;
  min-width:0;
}

.no-due-row{
  display:flex;
  align-items:center;
  gap:9px;
  margin:8px 0 4px;
  font-size:14px;
}

.no-due-row input{
  width:20px;
  height:20px;
  margin:0;
}

@media(max-width:430px){

  .hero-title{
    font-size:26px;
  }

  .person.left{
    left:7%;
  }

  .person.right{
    right:7%;
  }

  .loan-date-row{
    flex-direction:column;
    gap:0;
  }
}
</style>
</head>

<body>

<header>

<div class="brand">

<img
class="brand-logo"
src="data:image/jpeg;base64,REPLACE_LOGO_BASE64"
alt="TOOLVENTAR Logo"
>

<div>

<div class="brand-title">
TOOL<span>VENTAR</span>
</div>

<div class="brand-subtitle">
Werkzeug teilen. Einfach.
</div>

</div>

</div>

</header>

<main>

<div id="message" class="notice hidden"></div>

<div id="content"></div>

</main>

<script>

const SUPABASE_URL=
"https://shxpltkpkjbdyvjcoktc.supabase.co";

const SUPABASE_KEY=
"sb_publishable_5jZAPJUN2_DfMPFPBu352Q_RpfjUwPG";

const db=
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const content=
document.getElementById("content");

const message=
document.getElementById("message");

let S=loadUser();

let currentTools=[];


/* =========================
   BENUTZER
========================= */

function loadUser(){

try{

const saved=
localStorage.getItem(
"werkzeug_app_user"
);

if(!saved)return null;

const user=
JSON.parse(saved);

if(
user &&
typeof user.name==="string" &&
typeof user.group==="string" &&
user.name.trim() &&
user.group.trim()
){

return user;

}

return null;

}catch(e){

return null;

}

}


function saveUser(){

localStorage.setItem(
"werkzeug_app_user",
JSON.stringify(S)
);

}


function clearUser(){

localStorage.removeItem(
"werkzeug_app_user"
);

S=null;

}


/* =========================
   HILFSFUNKTIONEN
========================= */

function esc(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function showMessage(
text,
type="notice"
){

message.textContent=text;

message.className=
"notice "+type;

setTimeout(()=>{

message.className=
"notice hidden";

},3500);

}


/* =========================
   UPLOADER PRÜFEN
========================= */

function isToolCreator(tool){

if(!tool)return false;

const creator=
String(tool.created_by||"").trim();

const currentUser=
String(S?.name||"").trim();

if(!creator)return false;

return creator===currentUser;

}


/* =========================
   START
========================= */

async function start(){

if(S && S.name && S.group){

const ok=
await checkConnection();

if(ok){

await ensureCurrentMember();

home();

return;

}

}

welcome();

}


/* =========================
   VERBINDUNG
========================= */

async function checkConnection(){

try{

const {error}=
await db
.from("members")
.select("id")
.limit(1);

if(error)throw error;

return true;

}catch(error){

console.error(error);

showMessage(
"Verbindung zu Supabase fehlgeschlagen.",
"error"
);

return false;

}

}


/* =========================
   WILLKOMMEN
========================= */

function welcome(){

content.innerHTML=`

<div class="hero">

<div class="hero-top">

<div class="hero-title">
TOOL<span>VENTAR</span>
</div>

<div class="hero-text">

Dein gemeinsames Werkzeug-Inventar.
Behalte den Überblick darüber,
wem welches Werkzeug gehört
und wer es gerade ausgeliehen hat.

</div>

<div class="share-visual">

<div class="person left">
👨🏻
</div>

<div class="person right">
👨🏼
</div>

<div class="hand-tool">
🔧
</div>

<div class="toolbox"></div>

</div>

<div class="hero-slogan">
WERKZEUG TEILEN. EINFACH.
</div>

</div>

</div>


<div class="box">

<h2>
Willkommen 👋
</h2>

<p class="muted">
Verwalte Werkzeuge gemeinsam mit deinen Freunden.
</p>

<label>
Dein Name
</label>

<input
id="nameInput"
placeholder="z. B. Fabian"
autocomplete="name"
>

<label>
Gruppen-Code
</label>

<input
id="groupInput"
placeholder="z. B. ABC123"
autocapitalize="characters"
autocomplete="off"
>

<button id="joinButton">
👥 Gruppe beitreten
</button>

<button
id="createButton"
class="secondary"
>
＋ Neue Gruppe erstellen
</button>

</div>


<div class="box">

<b>
Schon einmal angemeldet?
</b>

<p class="muted small">

Deine Gruppe wird auf diesem iPhone gespeichert.
Beim nächsten Öffnen musst du Name und Code
nicht erneut eingeben.

</p>

</div>

`;

document
.getElementById("joinButton")
.onclick=
()=>joinGroup(false);

document
.getElementById("createButton")
.onclick=
()=>joinGroup(true);

}


/* =========================
   GRUPPE
========================= */

async function joinGroup(createNew){

const name=
document
.getElementById("nameInput")
.value
.trim();

let group=
document
.getElementById("groupInput")
.value
.trim()
.toUpperCase();

if(!name){

showMessage(
"Bitte deinen Namen eingeben.",
"error"
);

return;

}

if(createNew){

if(!group){

group=
createGroupCode();

}

}else{

if(!group){

showMessage(
"Bitte den Gruppencode eingeben.",
"error"
);

return;

}

const {data,error}=
await db
.from("members")
.select("id")
.eq("group_code",group)
.limit(1);

if(error){

console.error(error);

showMessage(
"Gruppe konnte nicht geprüft werden.",
"error"
);

return;

}

if(!data || data.length===0){

showMessage(
"Diese Gruppe gibt es noch nicht. Prüfe den Code.",
"error"
);

return;

}

}

S={
name:name,
group:group
};

saveUser();

const ok=
await ensureCurrentMember();

if(!ok){

clearUser();

return;

}

home();

}


function createGroupCode(){

const chars=
"ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

let result="";

for(let i=0;i<6;i++){

result+=
chars[
Math.floor(
Math.random()*chars.length
)
];

}

return result;

}


/* =========================
   MITGLIED
========================= */

async function ensureCurrentMember(){

try{

const {data,error}=
await db
.from("members")
.select("id")
.eq("group_code",S.group)
.eq("name",S.name)
.limit(1);

if(error)throw error;

if(!data || data.length===0){

const result=
await db
.from("members")
.insert({

group_code:S.group,
name:S.name

});

if(result.error){

throw result.error;

}

}

return true;

}catch(error){

console.error(error);

showMessage(
"Mitglied konnte nicht gespeichert werden: "+
error.message,
"error"
);

return false;

}

}


/* =========================
   NAVIGATION
========================= */

function navigation(){

return`

<div class="box nav">

<div class="row">

<button onclick="home()">
🔧 Werkzeuge
</button>

<button onclick="people()">
👥 Personen
</button>

<button
class="secondary"
onclick="changeGroup()"
>
Gruppe wechseln
</button>

</div>

</div>

`;

}


/* =========================
   HOME
========================= */

async function home(){

content.innerHTML=
navigation()+`

<div class="hero">

<div class="hero-title">
TOOL<span>VENTAR</span>
</div>

<div class="hero-text">

Gemeinsam Werkzeuge verwalten,
teilen und wiederfinden.

</div>

<div class="hero-slogan">
WERKZEUG TEILEN. EINFACH.
</div>

</div>


<div class="box">

<b>
Gruppe
</b>

<div class="group-code">
${esc(S.group)}
</div>

<div class="muted">
Hallo ${esc(S.name)} 👋
</div>

<button onclick="addTool()">
＋ Werkzeug hinzufügen
</button>

</div>


<div class="box">

<label for="toolSearch">
Werkzeug suchen
</label>

<div class="search-wrap">

<input
id="toolSearch"
placeholder="z. B. Hilti, Garten, Fabian..."
autocomplete="off"
>

<span class="search-icon">
🔎
</span>

</div>

</div>


<div id="toolsList">

<div class="box muted">
Werkzeuge werden geladen...
</div>

</div>

`;


const {data,error}=
await db
.from("tools")
.select("*")
.eq("group_code",S.group)
.order("created_at",{ascending:false});


if(error){

console.error(error);

document.getElementById(
"toolsList"
).innerHTML=`

<div class="box">

<b>
Fehler
</b>

<p class="muted">
${esc(error.message)}
</p>

</div>

`;

return;

}


currentTools=
data||[];


renderTools(currentTools);


document
.getElementById("toolSearch")
.addEventListener(
"input",
e=>filterTools(e.target.value)
);

}


/* =========================
   SUCHE
========================= */

function filterTools(query){

const q=
query
.trim()
.toLowerCase();

if(!q){

renderTools(currentTools);

return;

}

const filtered=
currentTools.filter(tool=>{

return[
tool.name,
tool.category,
tool.owner,
tool.description,
tool.borrower
].some(value=>

String(value??"")
.toLowerCase()
.includes(q)

);

});


renderTools(
filtered,
q
);

}


/* =========================
   WERKZEUGE
========================= */

function renderTools(
tools,
searchQuery=""
){

const list=
document.getElementById(
"toolsList"
);

if(!list)return;


if(!tools.length){

list.innerHTML=`

<div class="box empty">

🔎

<p>

${
searchQuery
? `Keine Werkzeuge für „${esc(searchQuery)}“ gefunden.`
: "Noch keine Werkzeuge in dieser Gruppe."
}

</p>

${
searchQuery

? `<button
class="secondary"
onclick="clearToolSearch()"
>
Suche löschen
</button>`

: `<button onclick="addTool()">
＋ Erstes Werkzeug hinzufügen
</button>`

}

</div>

`;

return;

}


list.innerHTML=
tools.map(tool=>{

let photo=
tool.image_url

? `<img
class="tool-photo"
src="${esc(tool.image_url)}"
alt=""
>`

: `<div class="tool-photo-placeholder">
🔧
</div>`;


let loanStatus="";


if(tool.borrower){

let dueText="";


if(tool.due_date){

const due=
new Date(
tool.due_date+"T23:59:59"
);

const today=
new Date();

today.setHours(
0,0,0,0
);


const formatted=
new Date(
tool.due_date+"T00:00:00"
)
.toLocaleDateString(
"de-DE"
);


let startText="";


if(tool.borrowed_at){

startText=
new Date(
tool.borrowed_at
)
.toLocaleDateString(
"de-DE"
);

}


dueText=

due<today

? `<br>
⚠️ Rückgabe überfällig
${startText?` · ${startText}`:""}
(bis ${formatted})`

: `<br>
📅
${startText?`${startText} – `:""}
bis ${formatted}`;

}else{

if(tool.borrowed_at){

const startText=
new Date(
tool.borrowed_at
)
.toLocaleDateString(
"de-DE"
);

dueText=
`<br>
📅 Seit ${startText}
· ohne Rückgabedatum`;

}

}


loanStatus=`

<span class="badge loan">

📦 Ausgeliehen an
${esc(tool.borrower)}

${dueText}

</span>

`;

}else{

loanStatus=`

<span class="badge">
✓ Verfügbar
</span>

`;

}


const creator=
isToolCreator(tool);


return`

<div class="box">

<div class="tool">

${photo}

<div class="tool-info">

<div class="tool-name">
${esc(tool.name)}
</div>

<div class="muted">
${esc(tool.category||"Sonstiges")}
</div>

<div class="small">

Besitzer:

<b>
${esc(tool.owner||"Unbekannt")}
</b>

</div>


${
tool.description

? `<p class="small">
${esc(tool.description)}
</p>`

: ""
}


${loanStatus}


<div class="row tool-actions">

${
tool.borrower

? `<button
onclick="returnTool('${tool.id}')"
>
↩️ Zurückgeben
</button>`

: `<button
onclick="borrowTool('${tool.id}')"
>
📦 Ausleihen
</button>`

}


${
creator

? `

<button
class="secondary"
onclick="editTool('${tool.id}')"
>
✏️ Bearbeiten
</button>

<button
class="danger"
onclick="deleteTool('${tool.id}')"
>
🗑️ Löschen
</button>

`

: `

<div class="owner-note">

🔒 Nur der Uploader kann dieses Werkzeug
bearbeiten oder löschen.

</div>

`

}

</div>

</div>

</div>

</div>

`;

}).join("");

}


function clearToolSearch(){

const input=
document.getElementById(
"toolSearch"
);

if(input){

input.value="";

}

renderTools(
currentTools
);

}


/* =========================
   WERKZEUG HINZUFÜGEN
========================= */

function addTool(){

content.innerHTML=
navigation()+`

<div class="box">

<h2>
Werkzeug hinzufügen
</h2>

<label>
Foto
</label>

<input
id="photoInput"
type="file"
accept="image/*"
capture="environment"
>

<div id="photoPreview"></div>


<label>
Werkzeugname
</label>

<input
id="toolName"
placeholder="z. B. Akkuschrauber"
>


<label>
Beschreibung
</label>

<textarea
id="toolDescription"
placeholder="z. B. Makita 18V..."
></textarea>


<label>
Kategorie
</label>

<select id="toolCategory">

<option>
Werkstatt
</option>

<option>
Garten
</option>

<option>
Haus
</option>

<option>
Auto
</option>

<option>
Baustelle
</option>

<option>
Sonstiges
</option>

</select>


<label>
Besitzer
</label>

<input
id="toolOwner"
value="${esc(S.name)}"
>


<button
id="saveToolButton"

function previewPhoto(event){

const file=
event.target.files[0];

if(!file)return;


const reader=
new FileReader();


reader.onload=()=>{

document.getElementById(
"photoPreview"
).innerHTML=

`<img
class="photo-preview"
src="${reader.result}"
alt="Vorschau"
>`;

};


reader.readAsDataURL(file);

}


function resizeImage(file){

return new Promise(
(resolve,reject)=>{

const reader=
new FileReader();


reader.onload=()=>{

const img=
new Image();


img.onload=()=>{

const maxSize=700;

let width=
img.width;

let height=
img.height;


if(width>height){

if(width>maxSize){

height=
Math.round(
height*maxSize/width
);

width=maxSize;

}

}else{

if(height>maxSize){

width=
Math.round(
width*maxSize/height
);

height=maxSize;

}

}


const canvas=
document.createElement(
"canvas"
);

canvas.width=width;

canvas.height=height;


canvas
.getContext("2d")
.drawImage(
img,
0,
0,
width,
height
);


resolve(
canvas.toDataURL(
"image/jpeg",
0.75
)
);

};


img.onerror=reject;

img.src=
reader.result;

};


reader.onerror=reject;

reader.readAsDataURL(file);

}

);

}

if(error || !data){

showMessage(

new Date();


const todayValue=
toDateValue(today);

navigation()+`

<label>
Von
</label>

<input
id="borrowFrom"
type="date"
value="${todayValue}"
>

</div>


<div class="loan-date-column">

<label>
Bis
</label>

<input
id="borrowUntil"
type="date"
value="${todayValue}"
>

</div>

</div>


<label class="no-due-row">

<input
id="noDueDate"
type="checkbox"
>

<span>
Ohne Rückgabedatum
</span>

</label>

</div>

id="confirmBorrowButton"
onclick="confirmBorrow('${id}')"
>
📦 Werkzeug ausleihen
</button>


<button
class="secondary"
onclick="home()"
>
Abbrechen
</button>

</div>

`;


const untilInput=
document.getElementById(
"borrowUntil"
);


const noDueDate=
document.getElementById(
"noDueDate"
);


noDueDate.addEventListener(
"change",
()=>{

untilInput.disabled=
noDueDate.checked;

untilInput.style.opacity=
noDueDate.checked
? ".5"
: "1";

}
);


document
.getElementById("borrowFrom")
.addEventListener(
"change",
()=>{

const from=
document.getElementById(
"borrowFrom"
).value;


if(
from &&
!noDueDate.checked
){

untilInput.min=
from;


if(
untilInput.value &&
untilInput.value<from
){

untilInput.value=
from;

}

}

}
);


untilInput.min=
todayValue;

}

   AUSLEIHE BESTÄTIGEN
========================= */

async function confirmBorrow(id){

const button=
document.getElementById(
"confirmBorrowButton"
);


const borrower=
document
.getElementById("borrowerInput")
.value
.trim();


const from=
document
.getElementById("borrowFrom")
.value;


const until=
document
.getElementById("borrowUntil")
.value;


const noDueDate=
document
.getElementById("noDueDate")
.checked;


if(!borrower){

showMessage(
"Bitte Namen eingeben.",
"error"
);

return;

}


if(!from){

showMessage(
"Bitte ein Startdatum auswählen.",
"error"
);

return;

}


if(
!noDueDate &&
!until
){

showMessage(
"Bitte ein Rückgabedatum auswählen.",
"error"
);

return;

}


if(
!noDueDate &&
until<from
){

showMessage(
"Das Rückgabedatum darf nicht vor dem Startdatum liegen.",
"error"
);

return;

}


button.disabled=true;

button.textContent=
"Speichere...";


try{

const borrowedAt=
new Date(
from+"T12:00:00"
).toISOString();


const dueDate=
noDueDate
? null
: until;


const {error:updateError}=
await db
.from("tools")
.update({

borrower:borrower,

borrowed_at:borrowedAt,

due_date:dueDate

})
.eq("id",id)
.eq("group_code",S.group);


if(updateError){

throw updateError;

}


const {data:tool,error:toolError}=
await db
.from("tools")
.select("name")
.eq("id",id)
.eq("group_code",S.group)
.single();


if(toolError){

console.error(toolError);

}


const {error:historyError}=
await db
.from("loan_history")
.insert({

group_code:S.group,

tool_id:id,

tool_name:
tool
? tool.name
: "Werkzeug",

borrower:borrower,

borrowed_at:borrowedAt,

due_date:dueDate

});


if(historyError){

console.error(historyError);

}


showMessage(
"Werkzeug wurde ausgeliehen ✓",
"success"
);


home();


}catch(error){

console.error(error);

showMessage(
"Ausleihen fehlgeschlagen: "+
error.message,
"error"
);


button.disabled=false;

button.textContent=
"📦 Werkzeug ausleihen";

}

}

return `${date.getFullYear()}-${String(
date.getMonth()+1
).padStart(2,"0")}-${String(
date.getDate()
).padStart(2,"0")}`;

}
