<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101820">
<title>TOOLVENTAR</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#eef0f2;
color:#111827;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

header{
background:#101820;
color:#fff;
padding:10px 16px;
padding-top:calc(10px + env(safe-area-inset-top));
box-shadow:0 3px 14px rgba(0,0,0,.18)
}

.brand{
max-width:700px;
margin:auto;
display:flex;
align-items:center;
gap:12px
}

.brand-logo{
width:58px;
height:58px;
border-radius:14px;
object-fit:cover;
flex-shrink:0;
background:#111
}

.brand-title{
font-size:23px;
font-weight:900;
letter-spacing:.8px;
line-height:1
}

.brand-title span{color:#f59e0b}

.brand-subtitle{
margin-top:6px;
color:#cbd5e1;
font-size:12px;
font-weight:500
}

main{
max-width:700px;
margin:auto;
padding:16px;
padding-bottom:40px
}

.box{
background:#fff;
border-radius:16px;
padding:16px;
margin-bottom:12px;
box-shadow:0 2px 10px rgba(0,0,0,.06)
}

h1,h2,h3{margin-top:0}

input,textarea,select{
width:100%;
padding:13px;
border:1px solid #d1d5db;
border-radius:10px;
font-size:16px;
margin:6px 0 12px;
background:#fff
}

input[type=date]{min-height:48px}

textarea{
min-height:90px;
resize:vertical
}

button{
border:0;
border-radius:11px;
padding:12px 15px;
background:#101820;
color:#fff;
font-size:16px;
font-weight:600;
margin:4px 4px 4px 0
}

button.secondary{
background:#e5e7eb;
color:#111827
}

button.danger{background:#b91c1c}

button:disabled{opacity:.55}

label{
display:block;
font-size:14px;
font-weight:600;
margin-top:5px
}

.muted{color:#6b7280}

.row{
display:flex;
flex-wrap:wrap;
gap:6px;
align-items:center
}

.nav{margin-bottom:12px}

.nav button{font-size:14px}

.tool{
display:flex;
gap:13px;
align-items:flex-start
}

.tool-photo,
.tool-photo-placeholder{
width:90px;
height:90px;
border-radius:13px;
flex-shrink:0
}

.tool-photo{
object-fit:cover;
background:#e5e7eb
}

.tool-photo-placeholder{
background:#e5e7eb;
display:flex;
align-items:center;
justify-content:center;
font-size:34px
}

.tool-info{
flex:1;
min-width:0
}

.tool-name{
font-size:18px;
font-weight:700
}

.badge{
display:inline-block;
padding:5px 9px;
border-radius:999px;
font-size:12px;
margin-top:7px;
background:#dcfce7;
color:#166534
}

.badge.loan{
background:#fee2e2;
color:#991b1b
}

.group-code{
font-size:30px;
font-weight:800;
letter-spacing:3px
}

.notice{
padding:11px 13px;
background:#eef2ff;
border-radius:10px;
margin-bottom:12px
}

.error{
background:#fee2e2;
color:#991b1b
}

.success{
background:#dcfce7;
color:#166534
}

.hidden{display:none!important}

.member{
padding:10px 0;
border-bottom:1px solid #eee
}

.member:last-child{border-bottom:0}

.small{font-size:13px}

.photo-preview{
width:140px;
height:140px;
object-fit:cover;
border-radius:14px;
margin:5px 0 10px
}

.empty{
text-align:center;
padding:25px 10px;
color:#6b7280
}

.search-wrap{position:relative}

.search-wrap input{padding-right:45px}

.search-icon{
position:absolute;
right:14px;
top:17px;
font-size:20px;
color:#6b7280;
pointer-events:none
}

.tool-actions{margin-top:9px}

.owner-note{
margin-top:8px;
padding:8px 10px;
border-radius:9px;
background:#f8fafc;
color:#6b7280;
font-size:12px
}

.hero{
background:linear-gradient(145deg,#111827,#202b35);
color:#fff;
border-radius:20px;
padding:22px 18px;
margin-bottom:12px;
box-shadow:0 5px 20px rgba(0,0,0,.14);
overflow:hidden;
position:relative
}

.hero:after{
content:"";
position:absolute;
width:150px;
height:150px;
border-radius:50%;
background:#f59e0b;
opacity:.12;
right:-50px;
top:-50px
}

.hero-top{
position:relative;
z-index:1
}

.hero-title{
font-size:29px;
font-weight:900;
letter-spacing:.5px;
margin-bottom:5px
}

.hero-title span{color:#f59e0b}

.hero-text{
color:#d1d5db;
font-size:14px;
line-height:1.45;
margin-bottom:18px
}

.share-visual{
position:relative;
height:125px;
margin-top:4px
}

.person{
position:absolute;
bottom:18px;
width:62px;
text-align:center;
font-size:45px;
line-height:1
}

.person.left{left:12%}
.person.right{right:12%}

.toolbox{
position:absolute;
left:50%;
bottom:5px;
transform:translateX(-50%);
width:125px;
height:48px;
background:#111827;
border:3px solid #f59e0b;
border-radius:8px 8px 12px 12px;
box-shadow:0 5px 12px rgba(0,0,0,.35)
}

.toolbox:before{
content:"";
position:absolute;
left:31px;
top:-21px;
width:57px;
height:20px;
border:4px solid #f59e0b;
border-bottom:0;
border-radius:12px 12px 0 0
}

.toolbox:after{
content:"🔧";
position:absolute;
left:42px;
top:5px;
font-size:27px
}

.hand-tool{
position:absolute;
left:50%;
top:28px;
transform:translateX(-50%);
font-size:31px;
z-index:2
}

.hero-slogan{
text-align:center;
font-size:13px;
font-weight:700;
color:#fbbf24;
letter-spacing:.4px;
margin-top:3px
}

.loan-date-box{
background:#f8fafc;
border:1px solid #e5e7eb;
border-radius:13px;
padding:12px;
margin:12px 0
}

.loan-date-row{
display:flex;
gap:10px
}

.loan-date-column{
flex:1;
min-width:0
}

.no-due-row{
display:flex;
align-items:center;
gap:9px;
margin:8px 0 4px;
font-size:14px
}

.no-due-row input{
width:20px;
height:20px;
margin:0
}

@media(max-width:430px){
.hero-title{font-size:26px}
.person.left{left:7%}
.person.right{right:7%}
.loan-date-row{
flex-direction:column;
gap:0
}
}
</style>
</head>

<script>

const SUPABASE_URL="https://shxpltkpkjbdyvjcoktc.supabase.co";
const SUPABASE_KEY="sb_publishable_5jZAPJUN2_DfMPFPBu352Q_RpfjUwPG";

const db=window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const content=document.getElementById("content");
const message=document.getElementById("message");

let S=loadUser();
let currentTools=[];

function loadUser(){
try{
const x=localStorage.getItem("werkzeug_app_user");
if(!x)return null;

const u=JSON.parse(x);

return u &&
typeof u.name==="string" &&
typeof u.group==="string" &&
u.name.trim() &&
u.group.trim()
?u:null;

}catch(e){
return null;
}
}

function saveUser(){
localStorage.setItem(
"werkzeug_app_user",
JSON.stringify(S)
);
}

function clearUser(){
localStorage.removeItem("werkzeug_app_user");
S=null;
}

function esc(v){
return String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

function showMessage(t,type="notice"){
message.textContent=t;
message.className="notice "+type;

setTimeout(()=>{
message.className="notice hidden";
},3500);
}


/* =========================
   WERKZEUG-BESITZER
========================= */

function isToolCreator(tool){

return !!tool &&
!!tool.created_by &&
String(tool.created_by).trim()===
String(S.name||"").trim();

}


/* =========================
   START
========================= */

async function start(){

if(S&&S.name&&S.group){

const ok=await checkConnection();

if(ok){
await ensureCurrentMember();
home();
return;
}

}

welcome();

}


/* =========================
   VERBINDUNG
========================= */

async function checkConnection(){

try{

const {error}=await db
.from("members")
.select("id")
.limit(1);

if(error)throw error;

return true;

}catch(e){

console.error(e);

showMessage(
"Verbindung zu Supabase fehlgeschlagen.",
"error"
);

return false;
}

}


/* =========================
   WILLKOMMEN
========================= */

function welcome(){

content.innerHTML=`

<div class="hero">

<div class="hero-top">

<div class="hero-title">
TOOL<span>VENTAR</span>
</div>

<div class="hero-text">
Dein gemeinsames Werkzeug-Inventar.
Behalte den Überblick darüber, wem welches
Werkzeug gehört und wer es gerade ausgeliehen hat.
</div>

<div class="share-visual">

<div class="person left">👨🏻</div>

<div class="person right">👨🏼</div>

<div class="hand-tool">🔧</div>

<div class="toolbox"></div>

</div>

<div class="hero-slogan">
WERKZEUG TEILEN. EINFACH.
</div>

</div>

</div>


<div class="box">

<h2>Willkommen 👋</h2>

<p class="muted">
Verwalte Werkzeuge gemeinsam mit deinen Freunden.
</p>

<label>Dein Name</label>

<input
id="nameInput"
placeholder="z. B. Fabian"
autocomplete="name"
>


<label>Gruppen-Code</label>

<input
id="groupInput"
placeholder="z. B. ABC123"
autocapitalize="characters"
autocomplete="off"
>


<button id="joinButton">
👥 Gruppe beitreten
</button>

<button id="createButton" class="secondary">
＋ Neue Gruppe erstellen
</button>

</div>


<div class="box">

<b>Schon einmal angemeldet?</b>

<p class="muted small">
Deine Gruppe wird auf diesem iPhone gespeichert.
Beim nächsten Öffnen musst du Name und Code
nicht erneut eingeben.
</p>

</div>

`;

document.getElementById("joinButton")
.onclick=()=>joinGroup(false);

document.getElementById("createButton")
.onclick=()=>joinGroup(true);

}


/* =========================
   GRUPPE BEITRETEN
========================= */

async function joinGroup(createNew){

const name=
document.getElementById("nameInput")
.value
.trim();

let group=
document.getElementById("groupInput")
.value
.trim()
.toUpperCase();

if(!name){

showMessage(
"Bitte deinen Namen eingeben.",
"error"
);

return;
}


if(createNew){

if(!group)
group=createGroupCode();

}else{

if(!group){

showMessage(
"Bitte den Gruppencode eingeben.",
"error"
);

return;
}


const {data,error}=await db
.from("members")
.select("id")
.eq("group_code",group)
.limit(1);

if(error){

console.error(error);

showMessage(
"Gruppe konnte nicht geprüft werden.",
"error"
);

return;
}


if(!data||!data.length){

showMessage(
"Diese Gruppe gibt es noch nicht. Prüfe den Code.",
"error"
);

return;
}

}


S={
name,
group
};

saveUser();

if(!await ensureCurrentMember()){

clearUser();
return;

}

home();

}


/* =========================
   GRUPPENCODE
========================= */

function createGroupCode(){

const chars=
"ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

let r="";

for(let i=0;i<6;i++){

r+=chars[
Math.floor(
Math.random()*chars.length
)
];

}

return r;

}


/* =========================
   MITGLIED SICHERN
========================= */

async function ensureCurrentMember(){

try{

const {data,error}=await db
.from("members")
.select("id")
.eq("group_code",S.group)
.eq("name",S.name)
.limit(1);

if(error)throw error;


if(!data||!data.length){

const r=await db
.from("members")
.insert({
group_code:S.group,
name:S.name
});

if(r.error)throw r.error;

}

return true;

}catch(e){

console.error(e);

showMessage(
"Mitglied konnte nicht gespeichert werden: "+
e.message,
"error"
);

return false;

}

}


/* =========================
   NAVIGATION
========================= */

function navigation(){

return`

<div class="box nav">

<div class="row">

<button onclick="home()">
🔧 Werkzeuge
</button>

<button onclick="people()">
👥 Personen
</button>

<button
class="secondary"
onclick="changeGroup()">
Gruppe wechseln
</button>

</div>

</div>

`;

}


/* =========================
   HAUPTSEITE
========================= */

async function home(){

content.innerHTML=

navigation()+`

<div class="hero">

/* =========================
   SUCHEN
========================= */

function filterTools(q){

q=q.trim().toLowerCase();

if(!q){

renderTools(currentTools);
return;

}

renderTools(

currentTools.filter(t=>

[
t.name,
t.category,
t.owner,
t.description,
t.borrower

].some(v=>

String(v??"")
.toLowerCase()
.includes(q)

)

),

q

);

}

/* =========================
   FOTO VORSCHAU
========================= */

function previewPhoto(e){

const f=e.target.files[0];

if(!f)return;


const r=new FileReader();

r.onload=()=>{

document.getElementById("photoPreview")
.innerHTML=

`<img
class="photo-preview"
src="${r.result}"
alt="Vorschau">`;

};

r.readAsDataURL(f);

}


/* =========================
   FOTO VERKLEINERN
========================= */

function resizeImage(file){

return new Promise(
(resolve,reject)=>{

const r=new FileReader();


r.onload=()=>{

const img=new Image();


img.onload=()=>{

const max=700;

let w=img.width;
let h=img.height;


if(w>h&&w>max){

h=Math.round(h*max/w);
w=max;

}

else if(h>=w&&h>max){

w=Math.round(w*max/h);
h=max;

}


const c=document.createElement("canvas");

c.width=w;
c.height=h;


c.getContext("2d")
.drawImage(
img,
0,
0,
w,
h
);


resolve(
c.toDataURL(
"image/jpeg",
.75
)
);

};


img.onerror=reject;

img.src=r.result;

};


r.onerror=reject;

r.readAsDataURL(file);

});

}

async function saveTool(){

document.getElementById(
"saveToolButton"
);

document.getElementById(
"toolName"
).value.trim();


const description=
document.getElementById(
"toolDescription"
).value.trim();

).value.trim();

document.getElementById(
"photoInput"
).files[0];

"Bitte Besitzer eingeben.",
"error"
);

b.disabled=true;

b.textContent="Speichere...";


try{

let image_url="";


if(photo)
image_url=await resizeImage(photo);


const {error}=await db
.from("tools")
.insert({

group_code:S.group,

name,

category,

owner,

description,

image_url,

borrower:null,

borrowed_at:null,

due_date:null,

created_by:S.name

});


if(error)throw error;


showMessage(
"Werkzeug gespeichert ✓",
"success"
);


home();


}catch(e){

console.error(e);

showMessage(
"Werkzeug konnte nicht gespeichert werden: "+
e.message,
"error"
);

.eq("id",id)

showMessage(

);

document.getElementById(
"editToolName"
).value.trim();


const description=

const category=

"Bitte Besitzer eingeben.",
"error"
);

.eq("id",id)
.eq("group_code",S.group)
.eq("created_by",S.name);

"success"

);

if(error||!data){

<div class="loan-date-row">

<label>
Von
</label>

<input
id="borrowFrom"
type="date"
value="${todayValue}"
>

</div>


<div class="loan-date-column">

<label>
Bis
</label>

<input
id="borrowUntil"
type="date"
value="${todayValue}"
>

</div>

</div>


<label class="no-due-row">

<input
id="noDueDate"
type="checkbox"
>

<span>
Ohne Rückgabedatum
</span>

</label>

</div>


<button
id="confirmBorrowButton"
onclick="confirmBorrow('${id}')">

📦 Werkzeug ausleihen

</button>


<button
class="secondary"
onclick="home()">

Abbrechen

</button>

</div>

`;


const until=
document.getElementById(
"borrowUntil"
);

const none=
document.getElementById(
"noDueDate"
);


none.addEventListener(
"change",
()=>{

until.disabled=none.checked;

until.style.opacity=
none.checked
?".5"
:"1";

});


document
.getElementById("borrowFrom")
.addEventListener(
"change",
()=>{

const from=
document.getElementById(
"borrowFrom"
).value;


if(
from &&
!none.checked
){

until.min=from;


if(
until.value &&
until.value<from
){

until.value=from;

}

}

});


until.min=todayValue;

}


/* =========================
   AUSLEIHE BESTÄTIGEN
========================= */

async function confirmBorrow(id){

const b=
document.getElementById(
"confirmBorrowButton"
);


const borrower=
document.getElementById(
"borrowerInput"
).value.trim();


const from=
document.getElementById(
"borrowFrom"
).value;


const until=
document.getElementById(
"borrowUntil"
).value;


const none=
document.getElementById(
"noDueDate"
).checked;


if(!borrower){

showMessage(
"Bitte Namen eingeben.",
"error"
);

return;

}


if(!from){

showMessage(
"Bitte ein Startdatum auswählen.",
"error"
);

return;

}


if(!none&&!until){

showMessage(
"Bitte ein Rückgabedatum auswählen.",
"error"
);

return;

}


if(!none&&until<from){

showMessage(
"Das Rückgabedatum darf nicht vor dem Startdatum liegen.",
"error"
);

return;

}


b.disabled=true;

b.textContent="Speichere...";


try{

const borrowedAt=
new Date(
from+"T12:00:00"
).toISOString();


const dueDate=
none
?
null
:
until;


const {error:updateError}=await db
.from("tools")
.update({

borrower,

borrowed_at:borrowedAt,

due_date:dueDate

})
.eq("id",id)
.eq("group_code",S.group);


if(updateError)
throw updateError;


const {data:tool}=await db
.from("tools")
.select("name")
.eq("id",id)
.eq("group_code",S.group)
.single();


const {error:historyError}=await db
.from("loan_history")
.insert({

group_code:S.group,

tool_id:id,

tool_name:
tool
?
tool.name
:
"Werkzeug",

borrower,

borrowed_at:borrowedAt,

due_date:dueDate

});


if(historyError)
console.error(historyError);


showMessage(
"Werkzeug wurde ausgeliehen ✓",
"success"
);

home();


}catch(e){

console.error(e);

showMessage(
"Ausleihen fehlgeschlagen: "+
e.message,
"error"
);


b.disabled=false;

b.textContent=
"📦 Werkzeug ausleihen";

}

}


/* =========================

========================= */

function toDateValue(d){

return `${d.getFullYear()}-${
String(d.getMonth()+1).padStart(2,"0")
}-${
String(d.getDate()).padStart(2,"0")
}`;

}
