<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101820">
<title>TOOLVENTAR</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#eef0f2;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#101820;color:#fff;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));box-shadow:0 3px 14px #0003}
.brand{max-width:700px;margin:auto;display:flex;align-items:center;gap:12px}
.brand-logo{width:58px;height:58px;border-radius:14px;object-fit:cover;flex-shrink:0}
.brand-title{font-size:23px;font-weight:900;letter-spacing:.8px}
.brand-title span,.hero-title span{color:#f59e0b}
.brand-subtitle{margin-top:5px;color:#cbd5e1;font-size:12px}
main{max-width:700px;margin:auto;padding:16px 16px 40px}
.box{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px #0000000f}
h1,h2,h3{margin-top:0}
input,textarea,select{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;margin:6px 0 12px;background:#fff}
textarea{min-height:90px;resize:vertical}
button{border:0;border-radius:11px;padding:12px 15px;background:#101820;color:#fff;font-size:16px;font-weight:600;margin:4px 4px 4px 0}
button.secondary{background:#e5e7eb;color:#111827}
button.danger{background:#b91c1c}
button:disabled{opacity:.55}
label{display:block;font-size:14px;font-weight:600;margin-top:5px}
.muted{color:#6b7280}
.small{font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.nav{margin-bottom:12px}
.nav button{font-size:13px}
.tool{display:flex;gap:13px;align-items:flex-start}
.tool-photo,.tool-photo-placeholder{width:90px;height:90px;border-radius:13px;flex-shrink:0}
.tool-photo{object-fit:cover;background:#e5e7eb}
.tool-photo-placeholder{background:#e5e7eb;display:flex;align-items:center;justify-content:center;font-size:34px}
.tool-info{flex:1;min-width:0}
.tool-name{font-size:18px;font-weight:700}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;margin-top:7px;background:#dcfce7;color:#166534}
.badge.loan{background:#fee2e2;color:#991b1b}
.group-code{font-size:30px;font-weight:800;letter-spacing:3px}
.notice{padding:11px 13px;background:#eef2ff;border-radius:10px;margin-bottom:12px}
.error{background:#fee2e2;color:#991b1b}
.success{background:#dcfce7;color:#166534}
.hidden{display:none!important}
.member{padding:10px 0;border-bottom:1px solid #eee}
.member:last-child{border:0}
.photo-preview{width:140px;height:140px;object-fit:cover;border-radius:14px;margin:5px 0 10px}
.empty{text-align:center;padding:25px 10px;color:#6b7280}
.search{position:relative}
.search input{padding-right:45px}
.search i{position:absolute;right:14px;top:18px;font-style:normal;color:#6b7280}
.owner-note{margin-top:8px;padding:8px 10px;border-radius:9px;background:#f8fafc;color:#6b7280;font-size:12px}
.hero{background:linear-gradient(145deg,#111827,#202b35);color:#fff;border-radius:20px;padding:22px 18px;margin-bottom:12px;box-shadow:0 5px 20px #00000024}
.hero-title{font-size:29px;font-weight:900}
.hero-text{color:#d1d5db;font-size:14px;line-height:1.45;margin:6px 0 18px}
.share{height:110px;position:relative}
.person{position:absolute;bottom:12px;font-size:44px}
.left{left:10%}.right{right:10%}
.toolbox{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:125px;height:48px;background:#111827;border:3px solid #f59e0b;border-radius:8px 8px 12px 12px}
.toolbox:before{content:"";position:absolute;left:31px;top:-21px;width:57px;height:20px;border:4px solid #f59e0b;border-bottom:0;border-radius:12px 12px 0 0}
.toolbox:after{content:"🔧";position:absolute;left:42px;top:5px;font-size:27px}
.slogan{text-align:center;color:#fbbf24;font-size:13px;font-weight:700;margin-top:8px}
.loanbox{background:#f8fafc;border:1px solid #e5e7eb;border-radius:13px;padding:12px;margin:12px 0}
.dates{display:flex;gap:10px}
.dates>div{flex:1}
.nodue{display:flex;align-items:center;gap:8px;font-size:14px;margin:5px 0}
.nodue input{width:20px;margin:0}
.account-btn{width:100%;text-align:left}
@media(max-width:430px){.dates{display:block}.hero-title{font-size:26px}}
</style>
</head>

<script>

const db=supabase.createClient(
"https://shxpltkpkjbdyvjcoktc.supabase.co",
"sb_publishable_5jZAPJUN2_DfMPFPBu352Q_RpfjUwPG"
);

const app=document.getElementById("app");
const msg=document.getElementById("msg");

let S=loadUser();
let tools=[];


/* =========================
   SPEICHER
========================= */

function loadUser(){

try{

const u=
JSON.parse(
localStorage.getItem(
"werkzeug_app_user"
)
);

return u&&u.name&&u.group
?u
:null;

}catch(e){

return null;

}

}


function saveUser(){

localStorage.setItem(
"werkzeug_app_user",
JSON.stringify(S)
);

}


function clearUser(){

localStorage.removeItem(
"werkzeug_app_user"
);

S=null;

}


function esc(v){

return String(v??"")
.replace(/[&<>"']/g,x=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[x]));

}


function note(text,type="notice"){

msg.textContent=text;
msg.className="notice "+type;

clearTimeout(note.timer);

note.timer=setTimeout(
()=>msg.className="notice hidden",
3500
);

}


/* =========================
   KONTO / BESITZER
========================= */

function isCreator(tool){

return !!tool?.created_by &&
!!S?.memberId &&
String(tool.created_by)===
String(S.memberId);

}


/* =========================
   MITGLIED LADEN
========================= */

async function ensureMember(){

try{

if(S.memberId){

const r=await db
.from("members")
.select("id,name,group_code")
.eq("id",S.memberId)
.eq("group_code",S.group)
.single();

if(!r.error&&r.data){

S.name=r.data.name;
saveUser();

return true;

}

S.memberId=null;

}


const r=await db
.from("members")
.select(
"id,name,group_code,created_at"
)
.eq("group_code",S.group)
.eq("name",S.name)
.order(
"created_at",
{ascending:true}
);


if(r.error)
throw r.error;


/*
Beim ersten Einstieg mit einem Namen
wird das älteste Konto verwendet.
Das ist wichtig für deinen bisherigen
Fabian-Account.
*/

if(r.data?.length){

S.memberId=r.data[0].id;
S.name=r.data[0].name;

saveUser();

return true;

}


const n=await db
.from("members")
.insert({
group_code:S.group,
name:S.name
})
.select(
"id,name,group_code"
)
.single();


if(n.error)
throw n.error;

S.memberId=n.data.id;

saveUser();

return true;

}catch(e){

console.error(e);

note(

async function migrateOldTools(){

try{

const old=tools.filter(
t=>!t.created_by
);

if(!old.length)
return;


const r=await db
.from("members")
.select(
"id,name,created_at"
)
.eq("group_code",S.group);


if(r.error)
return;


for(const t of old){

const candidates=
(r.data||[])
.filter(m=>
String(m.name||"").trim()===
String(t.owner||"").trim()
&&
(
!t.created_at||
!m.created_at||
new Date(m.created_at)<=
new Date(t.created_at)
)
)
.sort(
(a,b)=>
new Date(b.created_at||0)-
new Date(a.created_at||0)
);


if(candidates[0]){

await db
.from("tools")
.update({
created_by:candidates[0].id
})
.eq("id",t.id)
.is("created_by",null);

t.created_by=
candidates[0].id;

}

}

}catch(e){

console.warn(
"Alte Werkzeuge konnten nicht automatisch zugeordnet werden.",
e
);

}

}

/* =========================

========================= */

function previewPhoto(e){

const file=e.target.files[0];

if(!file)
return;

const r=new FileReader();

r.onload=()=>{

document.getElementById(
"photoPreview"
).innerHTML=

`<img
class="photo-preview"
src="${r.result}"
alt="">`;

};

r.readAsDataURL(file);

}


function resizeImage(file){

return new Promise(
(resolve,reject)=>{

const r=new FileReader();

r.onload=()=>{

const img=new Image();

img.onload=()=>{

const max=700;

let w=img.width;
let h=img.height;


if(w>h&&w>max){

h=Math.round(h*max/w);
w=max;

}else if(h>=w&&h>max){

w=Math.round(w*max/h);
h=max;

}


const c=
document.createElement("canvas");

c.width=w;
c.height=h;

c.getContext("2d")
.drawImage(
img,
0,
0,
w,
h
);


resolve(
c.toDataURL(
"image/jpeg",
.75
)
);

};

img.onerror=reject;

img.src=r.result;

};

r.onerror=reject;

r.readAsDataURL(file);

});

}

}


const same=
(r.data||[])
.filter(
m=>m.name===S.name
);


if(same.length<2){

note(
"Für deinen Namen gibt es nur ein Konto."
);

return;

}


app.innerHTML=
nav()+`

<div class="box">

<h2>
👤 Konto wechseln
</h2>

<p class="muted">

Es gibt mehrere Konten mit dem Namen
<b>${esc(S.name)}</b>.

Wähle das gewünschte Konto:

</p>

<div id="accounts"></div>

</div>

`;


document.getElementById(
"accounts"
).innerHTML=

same.map((m,i)=>{

const active=
String(m.id)===
String(S.memberId);


const date=
m.created_at
?
new Date(
m.created_at
).toLocaleDateString(
"de-DE"
)
:
"";


return`

<button
class="account-btn ${
active?"":"secondary"
}"
onclick="selectAccount('${m.id}')">

👤 ${esc(m.name)}

· Konto ${i+1}

${active?" · aktuell":""}

<br>

<span class="small">

Angelegt:
${date}

</span>

</button>

`;

}).join("");

}


/* =========================
   KONTO AUSWÄHLEN
========================= */

async function selectAccount(id){

const r=await db
.from("members")
.select(
"id,name,group_code"
)
.eq("id",id)
.eq("group_code",S.group)
.single();


if(r.error||!r.data){

note(
"Konto konnte nicht ausgewählt werden.",
"error"
);

return;

}


S.memberId=r.data.id;
S.name=r.data.name;

saveUser();

note(
"Konto gewechselt ✓",
"success"
);

home();

}
